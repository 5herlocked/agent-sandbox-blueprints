# Static checks only — no AWS credentials, nothing deployed.
#
# What this can catch: terraform that does not parse or is unformatted, charts that
# stop rendering, a credential or one deployment's account IDs getting committed.
#
# What it cannot catch: anything requiring a cluster. Whether Karpenter provisions a
# nested-virt node, whether a pod boots under kata-clh, whether a Microvm reaches
# RUNNING — all of that needs a real account and is verified by hand (see
# docs/TROUBLESHOOTING.md). Do not read a green check here as "the blueprint works".
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # lint:leaks and lint:secrets scan `git ls-files`, so the checkout must be
          # a real repo (it is) — but they only look at the current tree, not history.
          fetch-depth: 1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b /usr/local/bin
          task --version

      - name: terraform fmt + validate
        run: task lint:tf

      - name: No credentials committed
        run: task lint:secrets

      - name: No account or cluster identifiers committed
        run: task lint:leaks

      - name: Every chart renders
        run: task lint:render

  # Shared values must match in all three examples. AgentCore has different
  # substrate-only keys; compare the common values as YAML, not raw bytes.
  values-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: examples/_shared/values.yaml matches all three defaults.yaml
        run: |
          set -euo pipefail
          python3 -m venv /tmp/asb-ci-yaml
          /tmp/asb-ci-yaml/bin/pip install --disable-pip-version-check PyYAML==6.0.2
          /tmp/asb-ci-yaml/bin/python - <<'PY'
          import sys
          import yaml

          with open('examples/_shared/values.yaml') as f:
              shared = yaml.safe_load(f)
          for key in ('microvm', 'agentcore', 'dark-factory-shared'):
              shared.pop(key, None)
          failed = False
          for ex in ('dark-factory-kata', 'dark-factory-lambda', 'dark-factory-agentcore'):
              with open(f'examples/{ex}/defaults.yaml') as f:
                  values = yaml.safe_load(f)
              for key in ('microvm', 'agentcore', 'dark-factory-shared'):
                  values.pop(key, None)
              if values == shared:
                  print(f'✓ examples/{ex}/defaults.yaml common values in sync')
              else:
                  print(f'✗ examples/{ex}/defaults.yaml common values differ from _shared')
                  failed = True
          sys.exit(failed)
          PY
