# Self-managed AgentCore ACK controller. Wave 0 installs its CRD before the
# substrate's wave-1 graph references AgentRuntime. Managed ACK iam and eks
# reconcile the bootstrap role and association in the substrate chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ack-bedrockagentcorecontrol
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: public.ecr.aws/aws-controllers-k8s
    chart: bedrockagentcorecontrol-chart
    targetRevision: "1.15.1"
    helm:
      releaseName: ack-bedrockagentcorecontrol
      valuesObject:
        aws:
          region: us-west-2
        serviceAccount:
          create: true
          name: ack-bedrockagentcorecontrol-controller
        installScope: cluster
  destination:
    name: ${DESTINATION_CLUSTER}
    namespace: ack-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
