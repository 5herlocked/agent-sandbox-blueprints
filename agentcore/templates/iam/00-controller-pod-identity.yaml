{{/*
  ACK AgentCore controller → EKS Pod Identity (Managed ACK iam + eks).
  This role must exist before the controller can create the runtime/exec role;
  unlike the execution role, it cannot be a child of the KRO graph. Wave -2.
*/}}
{{- if .Values.agentcore.enabled }}
apiVersion: iam.services.k8s.aws/v1alpha1
kind: Role
metadata:
  name: {{ .Values.agentcore.podIdentity.clusterName }}-ack-bedrockagentcorecontrol
  namespace: {{ include "agentcore.namespace" . }}
  labels:
    {{- include "agentcore.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  name: {{ .Values.agentcore.podIdentity.clusterName }}-ack-bedrockagentcorecontrol-controller
  assumeRolePolicyDocument: |
    {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"pods.eks.amazonaws.com"},"Action":["sts:AssumeRole","sts:TagSession"]}]}
  inlinePolicies:
    agentcore-control: |
      {"Version":"2012-10-17","Statement":[
        {"Effect":"Allow","Action":[
          "bedrock-agentcore:CreateAgentRuntime","bedrock-agentcore:UpdateAgentRuntime",
          "bedrock-agentcore:DeleteAgentRuntime","bedrock-agentcore:GetAgentRuntime",
          "bedrock-agentcore:ListAgentRuntimes","bedrock-agentcore:ListAgentRuntimeVersions",
          "bedrock-agentcore:TagResource","bedrock-agentcore:UntagResource",
          "bedrock-agentcore:ListTagsForResource"],"Resource":"*"},
        {"Effect":"Allow","Action":"iam:PassRole","Resource":"arn:aws:iam::{{ .Values.agentcore.accountId }}:role/*-agentcore-exec"}
      ]}
---
apiVersion: eks.services.k8s.aws/v1alpha1
kind: PodIdentityAssociation
metadata:
  name: {{ .Values.agentcore.podIdentity.clusterName }}-ack-bedrockagentcorecontrol
  namespace: {{ include "agentcore.namespace" . }}
  labels:
    {{- include "agentcore.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  clusterName: {{ .Values.agentcore.podIdentity.clusterName }}
  namespace: {{ .Values.agentcore.podIdentity.controllerNamespace }}
  serviceAccount: {{ .Values.agentcore.podIdentity.controllerServiceAccount }}
  # PodIdentityAssociation takes a role ARN, not a reference to the ACK Role.
  roleARN: "arn:aws:iam::{{ .Values.agentcore.accountId }}:role/{{ .Values.agentcore.podIdentity.clusterName }}-ack-bedrockagentcorecontrol-controller"
{{- end }}
